<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Super Admin Login</title>

    <style>
      * {
        margin: 0;

        padding: 0;

        box-sizing: border-box;

        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;

        display: flex;

        justify-content: center;

        align-items: center;

        background: linear-gradient(150deg, #0f172a, #1e293b);
      }

      .login-card {
        width: 390px;

        background: #ffffff;

        padding: 40px;

        border-radius: 18px;
      }

      h1 {
        text-align: center;

        margin-bottom: 8px;
      }

      .subtitle {
        text-align: center;

        color: #64748b;

        margin-bottom: 30px;

        font-size: 13px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;

        margin-bottom: 8px;

        font-size: 13px;

        font-weight: 600;
      }

      input {
        width: 100%;

        height: 45px;

        border: 1px solid #cbd5e1;

        border-radius: 7px;

        padding: 0 12px;

        outline: none;
      }

      input:focus {
        border-color: #2563eb;
      }

      .password-box {
        position: relative;
      }

      .password-box input {
        padding-right: 65px;
      }

      #showPassword {
        position: absolute;

        right: 10px;

        top: 50%;

        transform: translateY(-50%);

        border: 0;

        background: transparent;

        color: #2563eb;

        cursor: pointer;
      }

      #errorMessage {
        display: none;

        background: #fee2e2;

        color: #dc2626;

        padding: 10px;

        border-radius: 6px;

        font-size: 12px;

        margin-bottom: 15px;
      }

      #loginButton {
        width: 100%;

        height: 46px;

        border: 0;

        background: #2454dc;

        color: white;

        font-weight: 600;

        border-radius: 7px;

        cursor: pointer;
      }

      #loginButton:disabled {
        opacity: 0.7;
      }

      .footer {
        margin-top: 22px;

        text-align: center;

        color: #94a3b8;

        font-size: 11px;
      }
    </style>
  </head>

  <body>
    <div class="login-card">
      <h1>Super Admin</h1>

      <p class="subtitle">Sign in to access your admin dashboard</p>

      <form id="loginForm">
        <div class="form-group">
          <label> Email Address </label>

          <input
            type="email"
            id="email"
            value="rakesh@avishospitals.com"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="form-group">
          <label> Password </label>

          <div class="password-box">
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
            />

            <button type="button" id="showPassword">Show</button>
          </div>
        </div>

        <div id="errorMessage"></div>

        <button id="loginButton" type="submit">Login</button>
      </form>

      <p class="footer">Authorized users only</p>
    </div>

    <script>
      // =====================================================
      // BACKEND URL
      // =====================================================

      const API_URL = "http://127.0.0.1:3000/api";

      // =====================================================
      // DOM ELEMENTS
      // =====================================================

      const loginForm = document.getElementById("loginForm");

      const emailInput = document.getElementById("email");

      const passwordInput = document.getElementById("password");

      const loginButton = document.getElementById("loginButton");

      const errorMessage = document.getElementById("errorMessage");

      const showPassword = document.getElementById("showPassword");

      // =====================================================
      // SHOW PASSWORD
      // =====================================================

      showPassword.addEventListener("click", () => {
        if (passwordInput.type === "password") {
          passwordInput.type = "text";

          showPassword.textContent = "Hide";
        } else {
          passwordInput.type = "password";

          showPassword.textContent = "Show";
        }
      });

      // =====================================================
      // LOGIN
      // =====================================================

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        hideError();

        const email = emailInput.value.trim();

        const password = passwordInput.value;

        if (!email || !password) {
          showError("Email and password are required");

          return;
        }

        try {
          loginButton.disabled = true;

          loginButton.textContent = "Logging in...";

          // =========================================
          // IMPORTANT
          // CALL PORT 3000, NOT PORT 5500
          // =========================================

          const response = await fetch(
            `${API_URL}/login`,

            {
              method: "POST",

              credentials: "include",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                email: email,

                password: password,
              }),
            },
          );

          const contentType = response.headers.get("content-type");

          if (!contentType || !contentType.includes("application/json")) {
            throw new Error("Backend returned invalid response");
          }

          const data = await response.json();

          console.log("Login response:", data);

          if (response.ok && data.success) {
            window.location.replace("./super-Admin.html");
            return;
          }

          showError(data.message || "Invalid login");
        } catch (error) {
          console.error("Login request error:", error);

          showError("Unable to connect to backend server");
        } finally {
          loginButton.disabled = false;

          loginButton.textContent = "Login";
        }
      });

      // =====================================================
      // SHOW ERROR
      // =====================================================

      function showError(message) {
        errorMessage.textContent = message;

        errorMessage.style.display = "block";
      }

      // =====================================================
      // HIDE ERROR
      // =====================================================

      function hideError() {
        errorMessage.textContent = "";

        errorMessage.style.display = "none";
      }
    </script>
  </body>
</html>
